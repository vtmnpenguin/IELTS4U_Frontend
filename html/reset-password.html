<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đặt mật khẩu mới | IELTS4U</title>
    <link rel="stylesheet" href="../css/auth.css" />
  </head>
  <body>
    <!-- SCR08 · Mặc định -->
    <main class="auth-page auth-page-full" id="resetDefault">
      <section class="auth-hero">
        <div class="auth-hero-inner">
          <a class="brand" href="onboarding.html"
            ><img src="../images/logo.png" alt="IELTS4U"
          /></a>
          <div class="auth-heading">
            <h1>ĐẶT MẬT KHẨU MỚI</h1>
            <p>Tạo mật khẩu mới để tiếp tục sử dụng IELTS4U.</p>
          </div>
        </div>
      </section>
      <section class="auth-form-section">
        <div class="auth-form-inner">
          <form id="resetForm">
            <label for="newPassword">Mật khẩu mới</label>
            <div class="password-wrap">
              <input
                id="newPassword"
                type="password"
                placeholder="Nhập mật khẩu mới"
              />
              <button
                class="show-password"
                type="button"
                data-target="newPassword"
                aria-label="Hiện mật khẩu"
              >
                <svg
                  viewBox="0 0 24 24"
                  width="18"
                  height="18"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>

            <label for="newPasswordConfirm">Xác nhận mật khẩu</label>
            <div class="password-wrap">
              <input
                id="newPasswordConfirm"
                type="password"
                placeholder="Nhập lại mật khẩu mới"
              />
              <button
                class="show-password"
                type="button"
                data-target="newPasswordConfirm"
                aria-label="Hiện mật khẩu"
              >
                <svg
                  viewBox="0 0 24 24"
                  width="18"
                  height="18"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
            <small class="error" id="resetError"></small>
            <button class="primary-btn" type="submit">Lưu mật khẩu mới</button>
          </form>
        </div>
      </section>
    </main>

    <!-- SCR08 · Liên kết hết hạn -->
    <main
      class="auth-page auth-page-full"
      id="resetExpired"
      style="display: none"
    >
      <section class="auth-hero">
        <div class="auth-hero-inner">
          <a class="brand" href="onboarding.html"
            ><img src="../images/logo.png" alt="IELTS4U"
          /></a>
          <div class="auth-heading">
            <div class="round-icon result-fail">
              <svg
                viewBox="0 0 24 24"
                width="26"
                height="26"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <circle cx="12" cy="13" r="8" />
                <path d="M12 9v4l3 2" />
                <path d="M9 2h6M12 2v3" />
              </svg>
            </div>
            <h1>LIÊN KẾT ĐÃ HẾT HẠN HOẶC ĐÃ ĐƯỢC SỬ DỤNG</h1>
          </div>
        </div>
      </section>
      <section class="auth-form-section">
        <div class="auth-form-inner" style="text-align: center">
          <a class="primary-btn button-link" href="forgot-password.html"
            >Yêu cầu liên kết mới</a
          >
        </div>
      </section>
    </main>

    <script src="../js/auth.js"></script>
    <script>
      if (new URLSearchParams(location.search).get("status") === "expired") {
        document.getElementById("resetDefault").style.display = "none";
        document.getElementById("resetExpired").style.display = "";
      }
    </script>
  </body>
</html>
