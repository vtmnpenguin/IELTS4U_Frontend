<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quên mật khẩu | IELTS4U</title>
    <link rel="stylesheet" href="../css/auth.css" />
  </head>
  <body>
    <main class="auth-page auth-page-full">
      <section class="auth-hero">
        <div class="auth-hero-inner">
          <a class="brand" href="onboarding.html"
            ><img src="../images/logo.png" alt="IELTS4U"
          /></a>
          <div class="auth-heading">
            <h1>QUÊN MẬT KHẨU?</h1>
            <p>Nhập email để nhận liên kết đặt lại mật khẩu</p>
          </div>
        </div>
      </section>

      <section class="auth-form-section">
        <div class="auth-form-inner">
          <form id="forgotForm">
            <div class="notice-banner" id="forgotNotice" role="alert" hidden>
              <span class="notice-icon" id="forgotNoticeIcon"></span>
              <span class="notice-text" id="forgotNoticeText"></span>
            </div>
            <label for="forgotEmail">Email</label>
            <input
              id="forgotEmail"
              type="email"
              placeholder="name@example.com"
            />
            <small class="error" id="forgotError"></small>
            <button class="primary-btn" type="submit">
              Gửi liên kết đặt lại
            </button>
          </form>
          <p class="switch-page">
            <a href="login.html">← Quay lại đăng nhập</a>
          </p>
        </div>
      </section>
    </main>
    <script src="../js/auth.js"></script>
  </body>
</html>
