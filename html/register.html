<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tạo tài khoản | IELTS4U</title>
    <link rel="stylesheet" href="../css/auth.css" />
  </head>
  <body>
    <main class="auth-page auth-page-full">
      <section class="auth-hero">
        <div class="auth-hero-inner">
          <a class="brand" href="onboarding.html"
            ><img src="../images/logo.png" alt="IELTS4U"
          /></a>
          <div class="auth-heading">
            <div class="round-icon">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="#8A9B83"
                stroke-width="2.6"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M22 10L12 5 2 10l10 5 10-5z" />
                <path d="M6 12v5c0 1.5 2.7 3 6 3s6-1.5 6-3v-5" />
                <path d="M22 10v6" />
              </svg>
            </div>
            <h1>TẠO TÀI KHOẢN</h1>
            <p>Bắt đầu hành trình học IELTS của bạn</p>
          </div>
        </div>
      </section>

      <section class="auth-form-section">
        <div class="auth-form-inner">
          <form id="registerForm" novalidate>
            <div
              class="notice error-notice"
              id="registerNotice"
              role="alert"
            ></div>

            <label for="fullName">Họ và tên</label>
            <input
              id="fullName"
              placeholder="Nhập họ và tên"
              autocomplete="name"
            />
            <small class="error" id="nameError"></small>

            <label for="regEmail">Email</label>
            <input
              id="regEmail"
              type="email"
              placeholder="Nhập email của bạn"
              autocomplete="email"
            />
            <small class="error" id="regEmailError"></small>

            <label for="regPassword">Mật khẩu</label>
            <div class="password-wrap">
              <input
                id="regPassword"
                type="password"
                placeholder="Tối thiểu 8 ký tự"
              />
              <button
                class="show-password"
                type="button"
                data-target="regPassword"
                aria-label="Hiện mật khẩu"
              >
                <svg
                  viewBox="0 0 24 24"
                  width="18"
                  height="18"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
            <small class="error" id="regPasswordError"></small>

            <label for="confirmPassword">Xác nhận mật khẩu</label>
            <div class="password-wrap">
              <input
                id="confirmPassword"
                type="password"
                placeholder="Nhập lại mật khẩu"
              />
              <button
                class="show-password"
                type="button"
                data-target="confirmPassword"
                aria-label="Hiện mật khẩu"
              >
                <svg
                  viewBox="0 0 24 24"
                  width="18"
                  height="18"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  aria-hidden="true"
                >
                  <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" />
                  <circle cx="12" cy="12" r="3" />
                </svg>
              </button>
            </div>
            <small class="error" id="confirmError"></small>

            <label class="check-row"
              ><input id="agree" type="checkbox" /> Tôi đồng ý với
              <a href="#" onclick="return false;">Điều khoản dịch vụ</a></label
            >
            <small class="error" id="agreeError"></small>

            <button class="primary-btn" type="submit">Đăng ký</button>
          </form>
          <p class="switch-page">
            Đã có tài khoản? <a href="login.html">Đăng nhập</a>
          </p>
        </div>
      </section>
    </main>
    <script src="../js/auth.js"></script>
    <script src="../js/register.js"></script>
  </body>
</html>
