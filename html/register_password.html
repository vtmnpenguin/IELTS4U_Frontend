<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đặt mật khẩu mới | IELTS4U</title>
    <link rel="stylesheet" href="../css/auth.css" />
  </head>
  <body>
    <main class="auth-page">
      <a class="brand" href="onboarding.html"
        ><img src="../images/logo.png" alt="IELTS4U"
      /></a>
      <section class="auth-card compact-card">
        <div class="auth-heading">
          <h1>ĐẶT MẬT KHẨU MỚI</h1>
          <p>Tạo mật khẩu mới để tiếp tục sử dụng IELTS4U.</p>
        </div>
        <form id="resetForm">
          <label for="newPassword">Mật khẩu mới</label
          ><input
            id="newPassword"
            type="password"
            placeholder="Nhập mật khẩu mới"
          /><label for="newPasswordConfirm">Xác nhận mật khẩu</label
          ><input
            id="newPasswordConfirm"
            type="password"
            placeholder="Nhập lại mật khẩu mới"
          /><small class="error" id="resetError"></small
          ><button class="primary-btn" type="submit">Lưu mật khẩu mới</button>
        </form>
      </section>
    </main>
    <script src="../js/auth.js"></script>
  </body>
</html>
